<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注册 - 财务管家</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {

                extend: {
                    "colors": {

                    "borderRadius": {

                        'button': '0 4px 0 0 rgba(255, 181, 197, 0.5)',

            }
        }
    </script>
<style>
        body {
            background-color: #FFF9FA; /* background-cream */
            color: #1b1c1c; /* on-background */
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 20px 20px, #FFDDE4 2px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-body-md text-body-md overflow-hidden relative">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary-container opacity-20 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30vw] h-[30vw] rounded-full bg-secondary-container opacity-20 blur-[80px] pointer-events-none"></div>
<main class="w-full max-w-[1200px] h-[600px] mx-auto flex flex-col md:flex-row shadow-soft bg-surface rounded-[24px] overflow-hidden relative z-10 m-container-margin">
<!-- Left Side: Brand Identity (Hidden on mobile) -->
<div class="hidden md:flex md:w-1/2 bg-pattern p-xl flex-col justify-center relative">
<div class="absolute inset-0 bg-gradient-to-br from-surface/80 to-primary-fixed/30 z-0"></div>
<div class="relative z-10 max-w-sm mx-auto text-center space-y-lg">
<div class="w-24 h-24 mx-auto bg-surface rounded-[24px] flex items-center justify-center shadow-soft mb-md rotate-[-5deg] transition-transform hover:rotate-0 duration-300">
<span class="text-4xl">🐷</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">财务管家</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    轻松记账，温馨理财。<br/>让每一次收支都变成美好的小确幸。
                </p>
<div class="grid grid-cols-2 gap-md mt-xl pt-xl border-t border-primary-container/30">
<div class="bg-surface/60 backdrop-blur-sm p-md rounded-xl shadow-sm text-left flex items-start space-x-sm">
<span class="material-symbols-outlined text-primary text-xl">analytics</span>
<div>
<h3 class="font-label-md text-label-md text-primary">极简分析</h3>
<p class="font-label-sm text-label-sm text-text-secondary mt-1">直观图表一目了然</p>
</div>
</div>
<div class="bg-surface/60 backdrop-blur-sm p-md rounded-xl shadow-sm text-left flex items-start space-x-sm">
<span class="material-symbols-outlined text-primary text-xl">security</span>
<div>
<h3 class="font-label-md text-label-md text-primary">安全可靠</h3>
<p class="font-label-sm text-label-sm text-text-secondary mt-1">数据加密云端同步</p>
</div>
</div>
</div>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-1/2 p-xl flex flex-col justify-center bg-surface relative z-10">
<div class="max-w-sm mx-auto w-full">
<!-- Mobile Header (Hidden on Desktop) -->
<div class="md:hidden text-center mb-xl">
<span class="text-5xl block mb-sm">🐷</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">财务管家</h1>
</div>
<div class="mb-xl text-center md:text-left">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">创建新账号 👋</h2>
<p class="font-body-md text-body-md text-text-secondary">开启您的温馨记账之旅</p>
</div>
<form class="space-y-lg">
<!-- Username -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="username">用户名</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center text-text-secondary">
<span class="material-symbols-outlined text-lg">person</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body-md text-body-md text-on-surface placeholder:text-text-secondary shadow-sm" id="username" placeholder="请输入用户名" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">设置密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center text-text-secondary">
<span class="material-symbols-outlined text-lg">lock</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body-md text-body-md text-on-surface placeholder:text-text-secondary shadow-sm" id="password" placeholder="至少8位字符" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="confirm-password">确认密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center text-text-secondary">
<span class="material-symbols-outlined text-lg">lock_reset</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body-md text-body-md text-on-surface placeholder:text-text-secondary shadow-sm" id="confirm-password" placeholder="再次输入密码" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-sm bg-primary-container text-on-primary-container font-label-md text-label-md font-bold rounded-xl shadow-button hover:bg-primary-fixed-dim hover:translate-y-[1px] hover:shadow-[0_3px_0_0_rgba(255,181,197,0.5)] active:translate-y-[4px] active:shadow-none transition-all flex items-center justify-center space-x-2" type="button">
<span>立即注册</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-label-md text-label-md text-text-secondary">
                        已有账号？ 
                        <a class="text-primary hover:text-primary-fixed-dim underline decoration-primary-container decoration-2 underline-offset-4 transition-colors" href="#">去登录</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
