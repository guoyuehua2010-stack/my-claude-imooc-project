<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 财务管家</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="../css/styles.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#874d5b",
                        "primary-container": "#ffb5c5",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7b4351",
                        "primary-fixed": "#ffd9e0",
                        "primary-fixed-dim": "#fcb2c2",
                        "secondary": "#744f90",
                        "secondary-container": "#deb3fd",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#654181",
                        "tertiary": "#2c6956",
                        "tertiary-container": "#98d6bf",
                        "background-cream": "#FFF9FA",
                        "text-secondary": "#9B9B9B",
                        "expense-coral": "#FF8A8A",
                        "income-mint": "#A8E6CF",
                        "surface": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e2",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#d6c2c4",
                        "category-dining": "#FFB5BA",
                        "category-transport": "#B5DAFF",
                        "category-shopping": "#FFE5B5",
                        "category-housing": "#C5E8D5",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                    },
                    boxShadow: {
                        'soft': '0 4px 15px -2px rgba(255, 181, 197, 0.15)',
                        'btn-press': '0 4px 10px rgba(255, 181, 197, 0.3)',
                    },
                    borderRadius: {
                        'card': '16px',
                        'input': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF9FA;
        }
        .shadow-soft {
            box-shadow: 0 4px 15px -2px rgba(255, 181, 197, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-5xl bg-white rounded-2xl shadow-soft flex flex-col md:flex-row overflow-hidden">
        <!-- Left Side: Brand & Welcome (Desktop) -->
        <div class="hidden md:flex md:w-1/2 bg-primary-fixed p-8 flex-col justify-between relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex items-center gap-2 text-primary mb-8">
                    <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                    <h1 class="font-display text-2xl font-bold text-primary">财务管家</h1>
                </div>
                <h2 class="font-display text-3xl font-bold text-on-primary-container mb-2">欢迎回来，<br/>让每一分钱都有迹可循</h2>
                <p class="font-body text-lg text-surface-variant max-w-md">
                    轻松记账，温馨理财。让每一次收支都变成美好的小确幸。
                </p>
            </div>
            <!-- Decorative Elements -->
            <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary-container rounded-full opacity-50 blur-3xl"></div>
            <div class="absolute -top-20 -right-20 w-80 h-80 bg-secondary-container rounded-full opacity-50 blur-3xl"></div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-center bg-white relative">
            <!-- Mobile Header -->
            <div class="flex md:hidden items-center justify-center gap-2 text-primary mb-8">
                <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                <h1 class="font-display text-xl font-bold text-primary">财务管家</h1>
            </div>

            <div class="max-w-md w-full mx-auto">
                <div class="mb-6">
                    <h2 class="font-display text-2xl md:text-3xl text-on-surface mb-1">登录账户</h2>
                    <p class="font-body text-base text-secondary">请输入您的用户名和密码以继续。</p>
                </div>

                <form id="login-form" class="flex flex-col gap-4">
                    <!-- Username -->
                    <div>
                        <label class="block font-body text-sm font-semibold text-surface-variant mb-1" for="username">用户名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-secondary">
                                <span class="material-symbols-outlined text-lg">person</span>
                            </span>
                            <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-input py-3 pl-10 pr-4 font-body text-base text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-colors"
                                id="username" name="username" placeholder="输入用户名" type="text" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block font-body text-sm font-semibold text-surface-variant mb-1" for="password">密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-secondary">
                                <span class="material-symbols-outlined text-lg">lock</span>
                            </span>
                            <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-input py-3 pl-10 pr-4 font-body text-base text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-colors"
                                id="password" name="password" placeholder="输入密码" type="password" required>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>

                    <!-- Loading State -->
                    <div id="login-loading" class="text-center hidden">
                        <span class="text-primary">登录中...</span>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="login-btn" class="w-full bg-primary text-on-primary font-body text-sm font-semibold py-3 rounded-lg shadow-soft hover:bg-on-primary-container transition-colors flex justify-center items-center gap-2 mt-2 disabled:opacity-50">
                        登录
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="font-body text-base text-on-surface">
                        还没有账户？
                        <a class="font-body text-sm font-semibold text-primary hover:text-on-primary-container transition-colors ml-1" href="register.html">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- API Module -->
    <script src="../js/api.js"></script>
    <script>
        // 检查是否已登录
        if (sessionManager.isLoggedIn()) {
            window.location.href = 'home.html';
        }

        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const loadingEl = document.getElementById('login-loading');
            const loginBtn = document.getElementById('login-btn');

            // 清除错误
            errorEl.classList.add('hidden');

            // 本地验证
            if (username.length < 3) {
                errorEl.textContent = '用户名至少需要3个字符';
                errorEl.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = '密码至少需要6位';
                errorEl.classList.remove('hidden');
                return;
            }

            // 显示加载状态
            loadingEl.classList.remove('hidden');
            loginBtn.disabled = true;

            try {
                const result = await userAPI.login(username, password);

                if (result.success) {
                    // 保存会话
                    sessionManager.saveSession(result.data);
                    // 跳转到首页
                    window.location.href = 'home.html';
                } else {
                    errorEl.textContent = result.message || '登录失败';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                console.error('登录错误:', error);
                errorEl.textContent = '网络错误，请检查服务器是否运行';
                errorEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
