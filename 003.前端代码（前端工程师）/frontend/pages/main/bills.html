<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计 - 财务管家</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom Styles -->
    <link href="../../css/styles.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#874d5b",
                        "primary-container": "#ffb5c5",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7b4351",
                        "primary-fixed": "#ffd9e0",
                        "primary-fixed-dim": "#fcb2c2",
                        "secondary": "#744f90",
                        "secondary-container": "#deb3fd",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#654181",
                        "tertiary": "#2c6956",
                        "tertiary-container": "#98d6bf",
                        "background-cream": "#FFF9FA",
                        "text-secondary": "#9B9B9B",
                        "expense-coral": "#FF8A8A",
                        "income-mint": "#A8E6CF",
                        "surface": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e2",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e9e8e7",
                        "outline-variant": "#d6c2c4",
                        "category-dining": "#FFB5BA",
                        "category-transport": "#B5DAFF",
                        "category-shopping": "#FFE5B5",
                        "category-housing": "#C5E8D5",
                        "category-entertainment": "#E0B5FF",
                        "category-medical": "#B5F0FF",
                        "category-communication": "#B5E8FF",
                        "category-edu": "#FFF5B5",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                    },
                    boxShadow: {
                        'soft-card': '0 15px 30px -2px rgba(255, 181, 197, 0.15)',
                        'btn-press': '0 4px 10px rgba(255, 181, 197, 0.3)',
                    },
                    borderRadius: {
                        'card': '16px',
                        'input': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF9FA;
        }
    </style>
</head>
<body class="text-on-surface antialiased">
    <!-- Main Content Area -->
    <main class="pb-24">
        <!-- Header -->
        <header class="bg-gradient-to-r from-primary-container to-secondary-container px-5 pt-8 pb-6">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-display text-2xl font-bold text-primary">财务管家</h1>
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-variant">
                    <img id="page-avatar" alt="User Profile" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop">
                </div>
            </div>
            <div>
                <h2 class="font-display text-xl text-on-surface mb-1">数据统计</h2>
                <p class="font-body text-sm text-surface-variant">查看收支分析</p>
            </div>
        </header>

        <!-- Content -->
        <div class="p-5 space-y-5">
            <!-- Month Selector -->
            <div class="flex items-center justify-center gap-4">
                <button class="w-9 h-9 rounded-full bg-white shadow-soft flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-surface-variant">chevron_left</span>
                </button>
                <span class="font-display text-base font-semibold text-on-surface">2026年8月</span>
                <button class="w-9 h-9 rounded-full bg-white shadow-soft flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
                </button>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white rounded-card p-3 shadow-soft-card border border-surface-variant/30 text-center">
                    <p class="font-body text-xs text-secondary mb-1">支出</p>
                    <p class="font-display text-lg font-bold text-expense-coral">¥ 2,450</p>
                </div>
                <div class="bg-white rounded-card p-3 shadow-soft-card border border-surface-variant/30 text-center">
                    <p class="font-body text-xs text-secondary mb-1">收入</p>
                    <p class="font-display text-lg font-bold text-income-mint">¥ 5,000</p>
                </div>
                <div class="bg-white rounded-card p-3 shadow-soft-card border border-surface-variant/30 text-center">
                    <p class="font-body text-xs text-secondary mb-1">结余</p>
                    <p class="font-display text-lg font-bold text-primary">¥ 2,550</p>
                </div>
            </div>

            <!-- Pie Chart -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <h3 class="font-display text-base font-semibold text-on-surface mb-4">支出构成</h3>
                <div class="h-48 flex items-center justify-center">
                    <canvas id="expenseChart"></canvas>
                </div>
                <!-- Legend -->
                <div class="mt-4 grid grid-cols-2 gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-category-dining"></span>
                        <span class="font-body text-xs text-secondary">餐饮 35%</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-category-transport"></span>
                        <span class="font-body text-xs text-secondary">交通 20%</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-category-shopping"></span>
                        <span class="font-body text-xs text-secondary">购物 25%</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-category-entertainment"></span>
                        <span class="font-body text-xs text-secondary">娱乐 20%</span>
                    </div>
                </div>
            </div>

            <!-- Monthly Trend -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <h3 class="font-display text-base font-semibold text-on-surface mb-4">近6月趋势</h3>
                <div class="h-40">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Transaction List -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-display text-base font-semibold text-on-surface">本月记录</h3>
                    <button class="text-primary hover:bg-primary-container/20 p-1 rounded-full transition-colors">
                        <span class="material-symbols-outlined text-lg">filter_list</span>
                    </button>
                </div>
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between pb-3 border-b border-background-cream">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-category-dining flex items-center justify-center text-lg">🍜</div>
                            <div>
                                <p class="font-body text-sm font-semibold text-on-surface">午餐</p>
                                <p class="font-body text-xs text-secondary">8月15日 12:30</p>
                            </div>
                        </div>
                        <p class="font-body text-sm font-semibold text-expense-coral">- ¥ 35.00</p>
                    </div>
                    <div class="flex items-center justify-between pb-3 border-b border-background-cream">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-category-transport flex items-center justify-center text-lg">🚗</div>
                            <div>
                                <p class="font-body text-sm font-semibold text-on-surface">加油</p>
                                <p class="font-body text-xs text-secondary">8月14日 09:15</p>
                            </div>
                        </div>
                        <p class="font-body text-sm font-semibold text-expense-coral">- ¥ 300.00</p>
                    </div>
                    <div class="flex items-center justify-between pb-3 border-b border-background-cream">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-income-mint flex items-center justify-center text-lg">💰</div>
                            <div>
                                <p class="font-body text-sm font-semibold text-on-surface">工资</p>
                                <p class="font-body text-xs text-secondary">8月10日 10:00</p>
                            </div>
                        </div>
                        <p class="font-body text-sm font-semibold text-income-mint">+ ¥ 5,000.00</p>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-category-shopping flex items-center justify-center text-lg">🛒</div>
                            <div>
                                <p class="font-body text-sm font-semibold text-on-surface">超市购物</p>
                                <p class="font-body text-xs text-secondary">8月8日 19:30</p>
                            </div>
                        </div>
                        <p class="font-body text-sm font-semibold text-expense-coral">- ¥ 156.50</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white flex justify-around py-3 px-2 shadow-[0_-2px_12px_rgba(0,0,0,0.08)] z-40 pb-5">
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="home.html">
            <span class="material-symbols-outlined text-[24px]">dashboard</span>
            <span class="font-body text-[10px]">首页</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="add.html">
            <span class="material-symbols-outlined text-[24px]">edit_square</span>
            <span class="font-body text-[10px]">明细</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-primary" href="bills.html">
            <span class="material-symbols-outlined text-[24px]">analytics</span>
            <span class="font-body text-[10px]">统计</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="profile.html">
            <span class="material-symbols-outlined text-[24px]">person</span>
            <span class="font-body text-[10px]">设置</span>
        </a>
    </nav>

    <script>
        // 支出构成饼图
        const expenseCtx = document.getElementById('expenseChart').getContext('2d');
        new Chart(expenseCtx, {
            type: 'doughnut',
            data: {
                labels: ['餐饮', '交通', '购物', '娱乐'],
                datasets: [{
                    data: [35, 20, 25, 20],
                    backgroundColor: ['#FFB5BA', '#B5DAFF', '#FFE5B5', '#E0B5FF'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                cutout: '65%'
            }
        });

        // 趋势图
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['3月', '4月', '5月', '6月', '7月', '8月'],
                datasets: [{
                    label: '支出',
                    data: [2100, 2400, 1950, 2800, 2200, 2450],
                    borderColor: '#FFB5C5',
                    backgroundColor: 'rgba(255, 181, 197, 0.1)',
                    tension: 0.4,
                    fill: true
                }, {
                    label: '收入',
                    data: [5000, 5000, 5000, 5000, 5000, 5000],
                    borderColor: '#A8E6CF',
                    backgroundColor: 'rgba(168, 230, 207, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { boxWidth: 12, padding: 16, font: { family: 'Be Vietnam Pro', size: 11 } }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: v => '¥' + v, font: { family: 'Be Vietnam Pro', size: 10 } }
                    }
                }
            }
        });

        // 加载保存的头像
        document.addEventListener('DOMContentLoaded', function() {
            const savedAvatar = localStorage.getItem('xiaoqianhe_avatar');
            if (savedAvatar) {
                const avatarImg = document.getElementById('page-avatar');
                if (avatarImg) avatarImg.src = savedAvatar;
            }
        });
    </script>
</body>
</html>
