<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 财务管家</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="../css/styles.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#874d5b",
                        "primary-container": "#ffb5c5",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7b4351",
                        "primary-fixed": "#ffd9e0",
                        "primary-fixed-dim": "#fcb2c2",
                        "secondary": "#744f90",
                        "secondary-container": "#deb3fd",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#654181",
                        "tertiary": "#2c6956",
                        "tertiary-container": "#98d6bf",
                        "background-cream": "#FFF9FA",
                        "text-secondary": "#9B9B9B",
                        "expense-coral": "#FF8A8A",
                        "income-mint": "#A8E6CF",
                        "surface": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e2",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#d6c2c4",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                    },
                    boxShadow: {
                        'soft': '0 4px 15px -2px rgba(255, 181, 197, 0.15)',
                        'button': '0 4px 0 0 rgba(255, 181, 197, 0.5)',
                    },
                    borderRadius: {
                        'card': '16px',
                        'input': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF9FA;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 20px 20px, #FFDDE4 2px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary-container opacity-20 blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[30vw] h-[30vw] rounded-full bg-secondary-container opacity-20 blur-[80px] pointer-events-none"></div>

    <main class="w-full max-w-[1200px] h-[600px] mx-auto flex flex-col md:flex-row shadow-soft bg-white rounded-2xl overflow-hidden relative z-10">
        <!-- Left Side: Brand Identity (Desktop only) -->
        <div class="hidden md:flex md:w-1/2 bg-pattern p-8 flex-col justify-center relative">
            <div class="absolute inset-0 bg-gradient-to-br from-white/80 to-primary-fixed/30 z-0"></div>
            <div class="relative z-10 max-w-sm mx-auto text-center space-y-6">
                <div class="w-24 h-24 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-soft mb-4 rotate-[-5deg] transition-transform hover:rotate-0 duration-300">
                    <span class="text-4xl">🐷</span>
                </div>
                <h1 class="font-display text-3xl font-bold text-primary tracking-tight">财务管家</h1>
                <p class="font-body text-lg text-surface-variant">
                    轻松记账，温馨理财。<br/>让每一次收支都变成美好的小确幸。
                </p>
                <div class="grid grid-cols-2 gap-4 mt-8 pt-8 border-t border-primary-container/30">
                    <div class="bg-white/60 backdrop-blur-sm p-4 rounded-xl shadow-sm text-left flex items-start space-x-2">
                        <span class="material-symbols-outlined text-primary text-xl">analytics</span>
                        <div>
                            <h3 class="font-body text-sm font-semibold text-primary">极简分析</h3>
                            <p class="font-body text-xs text-secondary mt-1">直观图表一目了然</p>
                        </div>
                    </div>
                    <div class="bg-white/60 backdrop-blur-sm p-4 rounded-xl shadow-sm text-left flex items-start space-x-2">
                        <span class="material-symbols-outlined text-primary text-xl">security</span>
                        <div>
                            <h3 class="font-body text-sm font-semibold text-primary">安全可靠</h3>
                            <p class="font-body text-xs text-secondary mt-1">数据加密本地存储</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Registration Form -->
        <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col justify-center bg-white relative z-10">
            <!-- Mobile Header -->
            <div class="md:hidden text-center mb-6">
                <span class="text-5xl block mb-2">🐷</span>
                <h1 class="font-display text-2xl text-primary">财务管家</h1>
            </div>

            <div class="max-w-sm mx-auto w-full">
                <div class="mb-6 text-center md:text-left">
                    <h2 class="font-display text-xl text-on-surface mb-1">创建新账号 👋</h2>
                    <p class="font-body text-base text-secondary">开启您的温馨记账之旅</p>
                </div>

                <form id="register-form" class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label class="block font-body text-sm font-semibold text-surface-variant mb-1" for="username">用户名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-secondary">
                                <span class="material-symbols-outlined text-lg">person</span>
                            </span>
                            <input class="w-full pl-10 pr-4 py-3 bg-white border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body text-base text-on-surface placeholder:text-secondary shadow-sm"
                                id="username" placeholder="请输入用户名 (3-20字符)" type="text" required minlength="3" maxlength="20">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block font-body text-sm font-semibold text-surface-variant mb-1" for="password">设置密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-secondary">
                                <span class="material-symbols-outlined text-lg">lock</span>
                            </span>
                            <input class="w-full pl-10 pr-4 py-3 bg-white border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body text-base text-on-surface placeholder:text-secondary shadow-sm"
                                id="password" placeholder="至少6位字符" type="password" required minlength="6">
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block font-body text-sm font-semibold text-surface-variant mb-1" for="confirm-password">确认密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-secondary">
                                <span class="material-symbols-outlined text-lg">lock_reset</span>
                            </span>
                            <input class="w-full pl-10 pr-4 py-3 bg-white border border-primary-fixed-dim/50 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary transition-colors outline-none font-body text-base text-on-surface placeholder:text-secondary shadow-sm"
                                id="confirm-password" placeholder="再次输入密码" type="password" required>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="register-error" class="text-red-500 text-sm text-center hidden"></div>

                    <!-- Success Message -->
                    <div id="register-success" class="text-green-500 text-sm text-center hidden"></div>

                    <!-- Loading State -->
                    <div id="register-loading" class="text-center hidden">
                        <span class="text-primary">注册中...</span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="register-btn" class="w-full py-3 bg-primary-container text-on-primary-container font-body text-sm font-bold rounded-xl shadow-button hover:bg-primary-fixed-dim hover:translate-y-[1px] hover:shadow-[0_3px_0_0_rgba(255,181,197,0.5)] active:translate-y-[4px] active:shadow-none transition-all flex items-center justify-center space-x-2 mt-2 disabled:opacity-50">
                        <span>立即注册</span>
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="font-body text-sm text-secondary">
                        已有账号？
                        <a class="text-primary hover:text-primary-fixed-dim underline decoration-primary-container decoration-2 underline-offset-4 transition-colors" href="login.html">去登录</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- API Module -->
    <script src="../js/api.js"></script>
    <script>
        // 注册表单提交
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            const loadingEl = document.getElementById('register-loading');
            const registerBtn = document.getElementById('register-btn');

            // 清除消息
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            // 本地验证
            if (username.length < 3 || username.length > 20) {
                errorEl.textContent = '用户名需要3-20个字符';
                errorEl.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = '密码至少需要6位';
                errorEl.classList.remove('hidden');
                return;
            }

            if (password !== confirmPassword) {
                errorEl.textContent = '两次密码输入不一致';
                errorEl.classList.remove('hidden');
                return;
            }

            // 显示加载状态
            loadingEl.classList.remove('hidden');
            registerBtn.disabled = true;

            try {
                const result = await userAPI.register(username, password);

                if (result.success) {
                    successEl.textContent = '注册成功！即将跳转到登录页...';
                    successEl.classList.remove('hidden');
                    // 保存会话
                    sessionManager.saveSession(result.data);
                    // 跳转到登录页
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    errorEl.textContent = result.message || '注册失败';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                console.error('注册错误:', error);
                errorEl.textContent = '网络错误，请检查服务器是否运行';
                errorEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
