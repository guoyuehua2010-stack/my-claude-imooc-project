<body class="text-on-surface antialiased">
    <!-- Main Content Area -->
    <main class="pb-24">
        <!-- Header -->
        <header class="bg-gradient-to-r from-primary-container to-secondary-container px-5 pt-8 pb-6">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-display text-2xl font-bold text-primary">财务管家</h1>
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-variant">
                    <img id="page-avatar" alt="User Profile" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop">
                </div>
            </div>
            <div>
                <h2 class="font-display text-xl text-on-surface mb-1">个人设置</h2>
                <p class="font-body text-sm text-surface-variant">管理您的账户信息</p>
            </div>
        </header>

        <!-- Content -->
        <div class="p-5 space-y-5">
            <!-- User Info Card -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <div class="flex items-center gap-4">
                    <!-- Avatar with Upload -->
                    <button id="avatar-btn" class="w-16 h-16 rounded-full overflow-hidden border-4 border-primary-container hover:border-primary transition-all relative group" onclick="document.getElementById('avatar-input').click()">
                        <img id="avatar-preview" alt="User Avatar" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop">
                        <!-- Upload Overlay -->
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-full">
                            <span class="material-symbols-outlined text-white text-xl">photo_camera</span>
                        </div>
                    </button>
                    <!-- Hidden File Input -->
                    <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                    <div>
                        <h2 id="profile-username" class="font-display text-lg font-bold text-on-surface">加载中...</h2>
                        <p id="profile-created" class="font-body text-sm text-secondary">注册于 -</p>
                    </div>
                </div>
            </div>

            <!-- Budget Settings -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <h3 class="font-display text-base font-semibold text-on-surface mb-3">预算设置</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="font-body text-sm text-on-surface">月度支出预算</span>
                        <span class="font-body text-sm text-primary font-semibold">¥ 3,000</span>
                    </div>
                    <div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
                        <div class="h-full bg-primary rounded-full" style="width: 65%;"></div>
                    </div>
                    <p class="font-body text-xs text-secondary">已使用 65%，剩余 ¥ 1,050</p>
                </div>
            </div>

            <!-- Data Management -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <h3 class="font-display text-base font-semibold text-on-surface mb-3">数据管理</h3>
                <div class="space-y-1">
                    <a href="accounts.html" class="w-full flex items-center justify-between py-3 px-2 hover:bg-surface-container-high rounded-lg transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">account_balance</span>
                            <span class="font-body text-sm text-on-surface">账户管理</span>
                        </div>
                        <span class="material-symbols-outlined text-secondary text-lg">chevron_right</span>
                    </a>
                    <a href="categories.html" class="w-full flex items-center justify-between py-3 px-2 hover:bg-surface-container-high rounded-lg transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">category</span>
                            <span class="font-body text-sm text-on-surface">分类管理</span>
                        </div>
                        <span class="material-symbols-outlined text-secondary text-lg">chevron_right</span>
                    </a>
                    <button class="w-full flex items-center justify-between py-3 px-2 hover:bg-surface-container-high rounded-lg transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">file_download</span>
                            <span class="font-body text-sm text-on-surface">导出数据 (CSV)</span>
                        </div>
                        <span class="material-symbols-outlined text-secondary text-lg">chevron_right</span>
                    </button>
                    <button class="w-full flex items-center justify-between py-3 px-2 hover:bg-surface-container-high rounded-lg transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">backup</span>
                            <span class="font-body text-sm text-on-surface">备份数据 (JSON)</span>
                        </div>
                        <span class="material-symbols-outlined text-secondary text-lg">chevron_right</span>
                    </button>
                    <button class="w-full flex items-center justify-between py-3 px-2 hover:bg-surface-container-high rounded-lg transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">restore</span>
                            <span class="font-body text-sm text-on-surface">恢复数据</span>
                        </div>
                        <span class="material-symbols-outlined text-secondary text-lg">chevron_right</span>
                    </button>
                </div>
            </div>

            <!-- About -->
            <div class="bg-white rounded-card p-4 shadow-soft-card border border-surface-variant/30">
                <h3 class="font-display text-base font-semibold text-on-surface mb-3">关于</h3>
                <div class="space-y-1">
                    <div class="flex items-center justify-between py-2 px-2">

                    </div>
                    <div class="flex items-center justify-between py-2 px-2">
                        <span class="font-body text-sm text-on-surface">数据存储</span>

                    </div>
                    <div class="flex items-center justify-between py-2 px-2">
                        <span class="font-body text-sm text-on-surface">隐私政策</span>

                    </div>

            <!-- Logout Button -->
            <button onclick="handleLogout()" class="w-full py-4 bg-red-50 text-red-500 font-body text-sm font-semibold rounded-xl transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">logout</span>
                退出登录
            </button>

            <!-- App Branding -->
            <div class="bg-gradient-to-r from-primary-container to-secondary-container rounded-card p-6 text-center text-white">
                <div class="text-3xl mb-2">💰</div>
                <h3 class="font-display text-lg font-bold">财务管家</h3>
                <p class="font-body text-xs opacity-90 mt-1">轻松记账，掌控财务</p>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white flex justify-around py-3 px-2 shadow-[0_-2px_12px_rgba(0,0,0,0.08)] z-40 pb-5">
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="dashboard.html">
            <span class="material-symbols-outlined text-[24px]">dashboard</span>
            <span class="font-body text-[10px]">首页</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="add.html">
            <span class="material-symbols-outlined text-[24px]">edit_square</span>
            <span class="font-body text-[10px]">明细</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-secondary" href="statistics.html">
            <span class="material-symbols-outlined text-[24px]">analytics</span>
            <span class="font-body text-[10px]">统计</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 px-3 py-1 text-primary" href="setting.html">
            <span class="material-symbols-outlined text-[24px]">person</span>
            <span class="font-body text-[10px]">设置</span>
        </a>
    </nav>

    <script src="../js/api.js"></script>
    <script>
        // ============ Avatar Upload ============
        const AVATAR_KEY = 'xiaoqianhe_avatar';

        // 页面加载时恢复保存的头像
        document.addEventListener('DOMContentLoaded', function() {
            const savedAvatar = localStorage.getItem(AVATAR_KEY);
            if (savedAvatar) {
                document.getElementById('avatar-preview').src = savedAvatar;
                const pageAvatar = document.getElementById('page-avatar');
                if (pageAvatar) pageAvatar.src = savedAvatar;
            }
        });

        // 处理头像上传
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }

            // 验证文件大小 (最大 2MB)
            if (file.size > 2 * 1024 * 1024) {
                alert('图片大小不能超过 2MB');
                return;
            }

            // 使用 FileReader 读取图片
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;

                // 保存到 localStorage
                localStorage.setItem(AVATAR_KEY, imageData);

                // 更新头像预览
                document.getElementById('avatar-preview').src = imageData;
                const pageAvatar = document.getElementById('page-avatar');
                if (pageAvatar) pageAvatar.src = imageData;
            };
            reader.readAsDataURL(file);
        }

        // 处理退出登录
        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            try {
                await userAPI.logout();
            } catch (e) {
                console.log('登出API调用失败', e);
            }
            sessionManager.clearSession();
            window.location.href = 'login.html';
        }

        // 加载用户信息
        async function loadUserProfile() {
            try {
                const result = await userAPI.getProfile();
                if (result.success) {
                    const user = result.data;
                    document.getElementById('profile-username').textContent = user.username;
                    const createdDate = new Date(user.createdAt);
                    const formattedDate = createdDate.getFullYear() + '年' + (createdDate.getMonth() + 1) + '月';
                    document.getElementById('profile-created').textContent = '注册于 ' + formattedDate;
                    if (user.avatar) {
                        document.getElementById('avatar-preview').src = user.avatar;
                        const pageAvatar = document.getElementById('page-avatar');
                        if (pageAvatar) pageAvatar.src = user.avatar;
                    }
                }
            } catch (e) {
                console.log('加载用户信息失败', e);
            }
        }
        // 页面加载时获取用户信息
        loadUserProfile();
    </script>
</body>
</html>
